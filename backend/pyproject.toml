[project]
name = "truth-file-corrector-backend"
version = "0.1.0"
description = "Backend for the Truth File Corrector — transcription, WER, and alignment."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "jiwer>=3.0.4",
    "whisper-normalizer>=0.0.10",
    "assemblyai>=0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
